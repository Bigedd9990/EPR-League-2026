<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esquina Park Rangers Tournament</title>
    <style>
        :root { --primary: #1b4332; --accent: #40916c; --bg: #f4f6f9; --card: #ffffff; --text: #2d3748; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; }
        header { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; text-align: center; padding: 2rem 1rem; }
        .live-indicator { display: inline-flex; align-items: center; background: rgba(255,255,255,0.2); padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.85rem; margin-top: 1rem; }
        .dot { width: 8px; height: 8px; background-color: #52b788; border-radius: 50%; margin-right: 6px; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        main { width: 95%; max-width: 1300px; margin: 2rem auto; }
        .card { background: var(--card); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); padding: 1.5rem; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: #edf2f7; padding: 12px; font-weight: 600; color: #4a5568; font-size: 0.85rem; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 0.9rem; white-space: nowrap; }
        tr:hover { background-color: #f8fafc; }
        .team-name { font-weight: 600; color: #1a202c; }
        .center { text-align: center; }
        .loading { text-align: center; padding: 3rem; font-style: italic; color: #718096; }
        .error-msg { text-align: center; color: #e53e3e; padding: 2rem; font-weight: bold; line-height: 1.6; }
    </style>
</head>
<body>
    <header>
        <h1>Esquina Park Rangers</h1>
        <p>5th Annual International Tournament Dashboard</p>
        <div class="live-indicator"><span class="dot"></span> Live Syncing Range A1:O21</div>
    </header>
    <main>
        <div class="card">
            <div id="table-destination"><div class="loading">Connecting to live tournament data...</div></div>
        </div>
    </main>
    <script>
        // FIXED: Combined the correct sheet ID with the CSV parameter explicitly
        const targetCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTeEkmGfdMyY5ILwraF8-Axuzx8-U5IAgNO9NYzd9ua-ogBiwaMMKKAq7zpK2lBseMnJ4WAC-AQ1Glv/pub?gid=198337941&single=true&output=csv";

        async function fetchLiveSheetGrid() {
            try {
                const response = await fetch(targetCsvUrl + "&nocache=" + new Date().getTime());
                if (!response.ok) throw new Error("Google Sheets server rejected the connection.");
                
                const rawText = await response.text();
                if (!rawText || rawText.trim() === "") throw new Error("Received empty data from spreadsheet.");
                
                // FIXED: Robust row-splitting parser logic
                const lines = rawText.split(\(/\r\)?\n/);
                const fullGrid = lines.map(row => row.split(','));
                
                // Keep only range up to row index 21
                const targetRows = fullGrid.slice(0, 21);

                let tableHtml = '<table><thead><tr>';
                
                // Generate headers from your data line 1 (Columns A to O)
                const headerLine = targetRows[0];
                for (let c = 0; c < 15; c++) {
                    const cellVal = headerLine[c] ? headerLine[c].trim() : '';
                    const alignLeft = (c === 3 || c === 6);
                    tableHtml += `<th class="${!alignLeft ? 'center' : ''}">${cellVal || '---'}</th>`;
                }
                tableHtml += '</tr></thead><tbody>';

                // Generate table data body matrix
                for (let r = 1; r < targetRows.length; r++) {
                    const currentRow = targetRows[r];
                    // Skip completely empty spacer rows safely
                    if (!currentRow || currentRow.join('').trim() === '') continue;

                    tableHtml += '<tr>';
                    for (let c = 0; c < 15; c++) {
                        const rawCell = currentRow[c] ? currentRow[c].trim() : '';
                        let alignmentClass = (c !== 3 && c !== 6) ? 'center' : 'team-name';
                        tableHtml += `<td class="${alignmentClass}">${rawCell || '-'}</td>`;
                    }
                    tableHtml += '</tr>';
                }
                tableHtml += '</tbody></table>';
                
                document.getElementById('table-destination').innerHTML = tableHtml;
            } catch (err) {
                console.error("Dashboard error details:", err);
                document.getElementById('table-destination').innerHTML = `
                    <div class="error-msg">
                        ⚠️ Dashboard Rendering Paused<br>
                        <span style="font-size:0.9rem; font-weight:normal; color:#4a5568;">Reason: ${err.message}</span><br>
                        <span style="font-size:0.8rem; font-weight:normal; color:#718096; display:block; margin-top:10px;">Retrying automatically in 15s...</span>
                    </div>`;
            }
        }

        // Run dashboard array layout compiler loop
        fetchLiveSheetGrid();
        setInterval(fetchLiveSheetGrid, 15000);
    </script>
</body>
</html>
