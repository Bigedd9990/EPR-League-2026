<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esquina Park Rangers Live Tournament Dashboard</title>

  <!-- Papa Parse CSV library (the previous code incorrectly loaded cloudflare.com) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --primary: #1b4332;
      --accent: #40916c;
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #2d3748;
      --muted: #718096;
      --error: #c53030;
      --success: #52b788;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }
    header {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      text-align: center;
      padding: 2.5rem 1rem;
      box-shadow: 0 4px 15px rgba(0,0,0,.1);
    }
    header h1 {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2rem);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    header p { margin: .5rem 0 0; opacity: .9; font-size: 1.1rem; }
    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,.2);
      padding: .45rem .85rem;
      border-radius: 20px;
      font-size: .85rem;
      margin-top: 1rem;
      font-weight: bold;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #cbd5e0;
      border-radius: 50%;
      flex: 0 0 8px;
    }
    .live-indicator.connected .dot { background: var(--success); animation: blink 1.5s infinite; }
    .live-indicator.failed .dot { background: #ffb4a2; }
    @keyframes blink { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    main { width: 95%; max-width: 1400px; margin: 2rem auto; }
    .card {
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.05);
      padding: clamp(1rem, 2vw, 1.5rem);
      overflow-x: auto;
      min-height: 165px;
    }
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 10px; }
    th {
      background: #edf2f7;
      padding: 12px;
      font-weight: 600;
      color: #4a5568;
      text-transform: uppercase;
      font-size: .85rem;
      white-space: nowrap;
    }
    td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: .95rem; white-space: nowrap; }
    tbody tr:hover { background: #f8fafc; }
    .team-name { font-weight: 600; color: #1a202c; }
    .pts-cell { font-weight: bold; color: var(--primary); background: #e8f5e9; text-align: center; }
    .center { text-align: center; }
    .loading, .error-msg, .empty-msg { text-align: center; padding: 3rem 1rem; }
    .loading, .empty-msg { font-style: italic; color: var(--muted); }
    .error-msg { color: var(--error); font-weight: bold; overflow-wrap: anywhere; }
    .error-detail { display: block; margin-top: .6rem; font-size: .9rem; font-weight: normal; color: var(--muted); }
    .footer { color: var(--muted); font-size: .8rem; text-align: right; margin-top: 1rem; }
    .retry { margin-top: 1rem; border: 0; border-radius: 6px; padding: .65rem 1rem; cursor: pointer; background: var(--primary); color: white; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <h1>Esquina Park Rangers</h1>
    <p>5th Annual International Tournament Dashboard</p>
    <div class="live-indicator" id="live-indicator" aria-live="polite">
      <span class="dot"></span>
      <span id="status-text">Connecting to Google Sheets…</span>
    </div>
  </header>

  <main>
    <div class="card">
      <div id="table-destination" aria-live="polite">
        <div class="loading">Loading tournament data from Google Sheets…</div>
      </div>
      <div class="footer" id="last-updated"></div>
    </div>
  </main>

  <script>
    // Published CSV for the requested worksheet tab (gid=198337941).
    const csvSourceUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTeEkmGfdMyY5ILwraF8-Axuzx8-U5IAgNO9NYzd9ua-ogBiwaMMKKAq7zpK2lBseMnJ4WAC-AQ1Glv/pub?gid=198337941&single=true&output=csv";

    const REFRESH_INTERVAL_MS = 15000;
    const MAX_ROWS = 21;       // Header row plus up to 20 data rows
    const MAX_COLUMNS = 15;    // Columns A to O

    const destination = document.getElementById("table-destination");
    const liveIndicator = document.getElementById("live-indicator");
    const statusText = document.getElementById("status-text");
    const lastUpdated = document.getElementById("last-updated");

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function setStatus(state, message) {
      liveIndicator.classList.remove("connected", "failed");
      if (state === "connected") liveIndicator.classList.add("connected");
      if (state === "failed") liveIndicator.classList.add("failed");
      statusText.textContent = message;
    }

    function showError(message) {
      setStatus("failed", "Connection problem — retrying every 15s");
      destination.innerHTML = `
        <div class="error-msg">
          Google Sheets data could not be displayed.
          <span class="error-detail">${escapeHtml(message)}</span>
          <button class="retry" type="button" id="retry-button">Try again now</button>
        </div>`;
      document.getElementById("retry-button").addEventListener("click", loadTournamentData);
    }

    function renderTable(rows) {
      if (!Array.isArray(rows) || rows.length === 0 ||
          rows.every(row => !Array.isArray(row) || row.join("").trim() === "")) {
        throw new Error("The published CSV returned no rows. Check that the correct worksheet is published to the web.");
      }

      const targetRows = rows.slice(0, MAX_ROWS);
      const headers = targetRows[0] || [];
      const columnCount = Math.min(MAX_COLUMNS, Math.max(headers.length, ...targetRows.map(row => row.length)));

      if (!columnCount) {
        throw new Error("No columns were found in the published sheet.");
      }

      let tableHtml = '<div class="table-wrap"><table><thead><tr>';
      for (let c = 0; c < columnCount; c++) {
        const headerValue = String(headers[c] ?? "").trim();
        const alignLeft = c === 3 || c === 6;
        tableHtml += `<th class="${alignLeft ? "" : "center"}">${escapeHtml(headerValue || "---")}</th>`;
      }
      tableHtml += "</tr></thead><tbody>";

      let displayedRows = 0;
      for (let r = 1; r < targetRows.length; r++) {
        const row = targetRows[r];
        if (!row || row.join("").trim() === "") continue;
        tableHtml += "<tr>";
        for (let c = 0; c < columnCount; c++) {
          const cellValue = String(row[c] ?? "").trim();
          let classes = "";
          if (c !== 3 && c !== 6) classes += " center";
          if (c === 3 || c === 6) classes += " team-name";
          if (c === 9 || c === 10) classes += " pts-cell";
          tableHtml += `<td class="${classes.trim()}">${escapeHtml(cellValue || "-")}</td>`;
        }
        tableHtml += "</tr>";
        displayedRows++;
      }
      tableHtml += "</tbody></table></div>";

      if (displayedRows === 0) {
        tableHtml += '<div class="empty-msg">The worksheet loaded, but no tournament rows were found below the header.</div>';
      }
      destination.innerHTML = tableHtml;
    }

    async function loadTournamentData() {
  setStatus("loading", "Syncing tournament data…");

  try {
    const separator = csvSourceUrl.includes("?") ? "&" : "?";
    const freshUrl =
      csvSourceUrl + separator + "_refresh=" + Date.now();

    const response = await fetch(freshUrl, {
      method: "GET",
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(
        `Google Sheets returned HTTP ${response.status}`
      );
    }

    const csvText = await response.text();

    if (
      !csvText.trim() ||
      csvText.trimStart().startsWith("<!DOCTYPE") ||
      csvText.trimStart().startsWith("<html")
    ) {
      throw new Error(
        "The response was HTML instead of CSV data."
      );
    }

    const rows = csvText
      .replace(/^\uFEFF/, "")
      .split(/\r?\n/)
      .filter(line => line.trim() !== "")
      .map(line => {
        const fields = [];
        let field = "";
        let quoted = false;

        for (let i = 0; i < line.length; i++) {
          const ch = line[i];

          if (ch === '"') {
            if (quoted && line[i + 1] === '"') {
              field += '"';
              i++;
            } else {
              quoted = !quoted;
            }
          } else if (ch === "," && !quoted) {
            fields.push(field);
            field = "";
          } else {
            field += ch;
          }
        }

        fields.push(field);
        return fields;
      });

    renderTable(rows);
    setStatus("connected", "Live Syncing — refreshes every 15s");
    lastUpdated.textContent =
      "Last updated: " + new Date().toLocaleTimeString();

  } catch (error) {
    console.error("Tournament dashboard error:", error);
    showError(error.message || "Unable to load tournament data.");
  }
}
        error: function(error) {
          console.error("Google Sheets download error:", error);
          showError(error && error.message ? error.message : "The CSV download failed. Check the published link and sharing settings.");
        }
      });
    }

    loadTournamentData();
    setInterval(loadTournamentData, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
