<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esquina Park Rangers Live Tournament Dashboard</title>
    <!-- LINE 7: Securely loads PapaParse to read your spreadsheet cells natively -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root { 
            --primary: #1b4332; 
            --accent: #40916c; 
            --bg: #f4f6f9; 
            --card: #ffffff; 
            --text: #2d3748; 
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 0; 
        }
        header { 
            background: linear-gradient(135deg, var(--primary), var(--accent)); 
            color: white; 
            text-align: center; 
            padding: 2.5rem 1rem; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        header h1 { margin: 0; font-size: 2rem; text-transform: uppercase; letter-spacing: 1px; }
        header p { margin: 0.5rem 0 0 0; opacity: 0.9; font-size: 1.1rem; }
        
        .live-indicator { 
            display: inline-flex; 
            align-items: center; 
            background: rgba(255,255,255,0.2); 
            padding: 0.4rem 0.8rem; 
            border-radius: 20px; 
            font-size: 0.85rem; 
            margin-top: 1rem; 
            font-weight: bold; 
        }
        .dot { 
            width: 8px; 
            height: 8px; 
            background-color: #52b788; 
            border-radius: 50%; 
            margin-right: 6px; 
            animation: blink 1.5s infinite; 
        }
        @keyframes blink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        
        main { width: 95%; max-width: 1400px; margin: 2rem auto; }
        
        .card { 
            background: var(--card); 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); 
            padding: 1.5rem; 
            overflow-x: auto;
        }
        
        table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 10px; }
        th { background-color: #edf2f7; padding: 12px; font-weight: 600; color: #4a5568; text-transform: uppercase; font-size: 0.85rem; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 0.95rem; white-space: nowrap; }
        tr:hover { background-color: #f8fafc; }
        
        .team-name { font-weight: 600; color: #1a202c; }
        .pts-cell { font-weight: bold; color: var(--primary); background-color: #e8f5e9; text-align: center; }
        .center { text-align: center; }
        .loading { text-align: center; padding: 3rem; font-style: italic; color: #718096; }
        .error-msg { text-align: center; color: #e53e3e; padding: 2rem; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>Esquina Park Rangers</h1>
        <p>5th Annual International Tournament Dashboard</p>
        <div class="live-indicator"><span class="dot"></span> Live Syncing Correct Tab (Every 15s)</div>
    </header>

    <main>
        <div class="card">
            <div id="table-destination">
                <div class="loading">Streaming raw tournament data directly from Google...</div>
            </div>
        </div>
    </main>

    <script>
        // Points directly to your specific spreadsheet tab ID upfront so Google doesn't deliver the wrong sheet
        const csvSourceUrl = "https://google.com";

        function parseLiveTournamentData() {
            Papa.parse(csvSourceUrl + "&timestamp=" + new Date().getTime(), {
                download: true,
                header: false,
                skipEmptyLines: true,
                complete: function(results) {
                    try {
                        const rows = results.data;
                        
                        // Extract rows 1 to 21 (indices 0 through 20)
                        const targetSlice = rows.slice(0, 21);
                        if (targetSlice.length === 0) throw new Error("No grid data found.");

                        // Build table headers from row 1 (columns A to O)
                        let tableHtml = '<table><thead><tr>';
                        const headers = targetSlice[0];
                        
                        // Restrict table width strictly to your 15 requested display columns (A to O)
                        const totalCols = Math.min(headers.length, 15);
                        for (let c = 0; c < totalCols; c++) {
                            const headerValue = headers[c] ? headers[c].trim() : '';
                            const alignLeft = (c === 3 || c === 6); 
                            tableHtml += `<th class="${!alignLeft ? 'center' : ''}">${headerValue || '---'}</th>`;
                        }
                        tableHtml += '</tr></thead><tbody>';

                        // Build data row entries (rows 2 through 21)
                        for (let r = 1; r < targetSlice.length; r++) {
                            const currentRow = targetSlice[r];
                            if (!currentRow || currentRow.join('').trim() === '') continue;

                            tableHtml += '<tr>';
                            for (let c = 0; c < totalCols; c++) {
                                const cellValue = currentRow[c] ? currentRow[c].trim() : '';
                                let classes = '';

                                if (c !== 3 && c !== 6) classes += ' center';
                                if (c === 3 || c === 6) classes += ' team-name';
                                if (c === 9 || c === 10) classes += ' pts-cell';

                                tableHtml += `<td class="${classes}">${cellValue || '-'}</td>`;
                            }
                            tableHtml += '</tr>';
                        }
                        tableHtml += '</tbody></table>';

                        document.getElementById('table-destination').innerHTML = tableHtml;

                    } catch (error) {
                        renderErrorBox(error.message);
                    }
                },
                error: function(err) {
                    renderErrorBox("Google data synchronization blocked.");
                }
            });
        }

        function renderErrorBox(msg) {
            document.getElementById('table-destination').innerHTML = `
                <div class="error-msg">
                    ⚠️ Data Stream Error<br>
                    <span style="font-size:0.85rem; font-weight:normal; color:#718096;">Reason: ${msg}. Retrying layout connection...</span>
                </div>`;
        }

        // Run instantly on startup
        parseLiveTournamentData();

        // Refresh calculations background seamlessly every 15 seconds
        setInterval(parseLiveTournamentData, 15000);
    </script>
</body>
</html>
