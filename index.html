<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esquina Park Rangers Live Tournament Dashboard</title>
    <style>
        :root { 
            --primary: #1b4332; 
            --accent: #40916c; 
            --bg: #f4f6f9; 
            --card: #ffffff; 
            --text: #2d3748; 
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 0; 
        }
        header { 
            background: linear-gradient(135deg, var(--primary), var(--accent)); 
            color: white; 
            text-align: center; 
            padding: 2rem 1rem; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        header h1 { margin: 0; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 1px; }
        header p { margin: 0.5rem 0 0 0; opacity: 0.9; font-size: 1rem; }
        
        .live-indicator { 
            display: inline-flex; 
            align-items: center; 
            background: rgba(255,255,255,0.2); 
            padding: 0.4rem 0.8rem; 
            border-radius: 20px; 
            font-size: 0.85rem; 
            margin-top: 1rem; 
            font-weight: bold; 
        }
        .dot { 
            width: 8px; 
            height: 8px; 
            background-color: #52b788; 
            border-radius: 50%; 
            margin-right: 6px; 
            animation: blink 1.5s infinite; 
        }
        @keyframes blink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        
        main { width: 95%; max-width: 1400px; margin: 1.5rem auto; }
        
        .card { 
            background: var(--card); 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); 
            padding: 1rem; 
            overflow: hidden;
        }

        /* Seamless window container optimized to mask out Google's top interface cleanly */
        .dashboard-window {
            position: relative;
            width: 100%;
            height: 590px; /* Sized perfectly to display your exact A1 to O21 grid area */
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }
        
        iframe {
            position: absolute;
            top: -45px; /* Slices out the default spreadsheet title banner bar cleanly */
            left: 0;
            width: 100%;
            height: calc(100% + 45px);
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Esquina Park Rangers</h1>
        <p>Live International Tournament Dashboard</p>
        <div class="live-indicator"><span class="dot"></span> Live Sync Enabled (Auto-Refreshing)</div>
    </header>

    <main>
        <div class="card">
            <div class="dashboard-window">
                <!-- Google's Native Web Embed: Runs immediately and completely bypasses browser security errors -->
                <iframe id="live-tournament-frame" src="https://google.com"></iframe>
            </div>
        </div>
    </main>

    <script>
        // Background live updater loops
        setInterval(function() {
            const frame = document.getElementById('live-tournament-frame');
            if (frame) {
                const cleanSourceUrl = "https://google.com";
                // Appends a tracking variable to clear browser cache and force clean real-time updates smoothly
                frame.src = cleanSourceUrl + "&nocache=" + new Date().getTime();
            }
        }, 15000); // Forces updates silently behind the scenes every 15 seconds!
    </script>

</body>
</html>
